name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Show dependency resolution info
        run: ./gradlew dependencies --configuration releaseRuntimeClasspath 2>&1 | tail -50 || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --info 2>&1 | tee build_output.txt; EXIT=${PIPESTATUS[0]}; if [ $EXIT -ne 0 ]; then grep -E "(FAILED|error:|e:.*\.kt|Could not resolve|> Could not|Unresolved)" build_output.txt | head -80; exit $EXIT; fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkOS-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build_output.txt
